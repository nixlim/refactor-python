# Save as .importlinter (or move into [tool.importlinter] in pyproject.toml). Run: lint-imports
[importlinter]
root_package = CHANGE_ME
include_external_packages = False

# Feature packages must not import each other (they may share a common/ core layer).
[importlinter:contract:features-independent]
name = feature packages are independent
type = independence
modules =
    CHANGE_ME.orders
    CHANGE_ME.billing
    CHANGE_ME.users

# Optional layering: higher layers may import lower, never the reverse.
[importlinter:contract:layers]
name = layering
type = layers
layers =
    CHANGE_ME.api
    CHANGE_ME.services
    CHANGE_ME.domain
    CHANGE_ME.infra
