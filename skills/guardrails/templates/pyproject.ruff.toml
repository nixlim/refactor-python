# Merge into pyproject.toml. Thresholds are deliberate; raise only with a comment explaining why.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90", "PLR0904", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR1702"]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50
max-args = 6
max-branches = 12
max-returns = 6
max-public-methods = 20
max-nested-blocks = 4

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913", "PLR0915"]
