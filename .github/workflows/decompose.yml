name: Decomposition capabilities
on: [push, pull_request]
jobs:
  capabilities:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: ruff check --isolated --select E9,F skills/decompose/scripts skills/decompose/tests skills/split-module/scripts
      - run: python -m compileall -q skills
      - run: bash -n skills/split-module/scripts/verify.sh
